apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/instance: cert-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: x509-certificate-exporter
    app.kubernetes.io/version: 4.2.2
    helm.sh/chart: x509-certificate-exporter-4.2.2
  name: cert-exporter-x509-certificate-exporter
  namespace: syn-cert-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: secrets
      app.kubernetes.io/instance: cert-exporter
      app.kubernetes.io/name: x509-certificate-exporter
  template:
    metadata:
      annotations:
        checksum/config: da0a27466bb38bda83af5964907e4f3ac694e100fa6f8a558547bb7d6f19a6a0
      labels:
        app.kubernetes.io/component: secrets
        app.kubernetes.io/instance: cert-exporter
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: x509-certificate-exporter
        app.kubernetes.io/version: 4.2.2
        helm.sh/chart: x509-certificate-exporter-4.2.2
    spec:
      containers:
        - args:
            - --config=/etc/x509-certificate-exporter/config.yaml
          image: quay.io/enix/x509-certificate-exporter:4.2.2-scratch
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 25
            periodSeconds: 10
          name: x509-certificate-exporter
          ports:
            - containerPort: 9793
              name: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            limits:
              cpu: 1000m
              memory: 150Mi
            requests:
              cpu: 20m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsUser: 65534
          volumeMounts:
            - mountPath: /etc/x509-certificate-exporter
              name: config
              readOnly: true
      priorityClassName: system-cluster-critical
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cert-exporter-x509-certificate-exporter
      volumes:
        - configMap:
            name: cert-exporter-x509-certificate-exporter-secrets
          name: config
