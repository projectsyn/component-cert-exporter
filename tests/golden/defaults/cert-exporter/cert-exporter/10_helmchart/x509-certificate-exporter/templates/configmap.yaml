apiVersion: v1
data:
  config.yaml: |
    web:
      enableStats: true

    server:
      listen: ":9793"

    log:
      level: info
      format: text

    metrics:
      exposeRelative: false
      exposePerCertError: false
      exposeNotBefore: false
      exposeExpired: true
      exposeDiagnostics: false

    sources:
      - kind: kubernetes
        name: cluster-secrets
        namespaces:
          include: ["*"]
          exclude: []
          includeLabels: []
          excludeLabels: []
        secrets:
          include: ["*"]
          exclude: []
          includeLabels: []
          excludeLabels: []
          types:
            - type: "kubernetes.io/tls"
              keyPatterns: ["^tls\\.crt$"]
              format: pem
          exposeLabels: []
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: cert-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: x509-certificate-exporter
    app.kubernetes.io/version: 4.2.0
    helm.sh/chart: x509-certificate-exporter-4.2.0
  name: cert-exporter-x509-certificate-exporter-secrets
  namespace: syn-cert-exporter
---
apiVersion: v1
data:
  config.yaml: "web:\n  enableStats: true\n\nserver:\n  listen: \":9793\"\n\nlog:\n\
    \  level: info\n  format: text\n\nmetrics:\n  exposeRelative: false\n  exposePerCertError:\
    \ false\n  exposeNotBefore: false\n  exposeExpired: true\n  exposeDiagnostics:\
    \ false\n  trimPathComponents: 3\n\ncache:\n  filePoll:\n    interval: 300s\n\
    \    skipUnchanged: true\n\nsources:\n  - kind: file\n    name: host-paths-master\n\
    \    followSymlinks: true\n    paths:\n      - /mnt/watch/dir-3c7986266497f70a0ca6dc6776cc96e1e1d3dcb6/etc/kubernetes/ssl/*\n\
    \    # Map host-namespace path prefixes (where symlink targets are\n    # recorded)\
    \ to the paths the exporter actually sees inside the pod.\n    # Mirrors the volume\
    \ mounts generated in daemonset.yaml. A non-empty\n    # list also confines symlink\
    \ resolution to these scopes \u2014 anything\n    # that escapes raises x509_source_errors_total{reason=\"\
    out_of_scope_symlink\"}.\n    pathMappings:\n      - from: \"/etc/kubernetes/ssl\"\
    \n        to: \"/mnt/watch/dir-3c7986266497f70a0ca6dc6776cc96e1e1d3dcb6/etc/kubernetes/ssl\"\
    \n    formats: [pem]\n"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: cert-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: x509-certificate-exporter
    app.kubernetes.io/version: 4.2.0
    helm.sh/chart: x509-certificate-exporter-4.2.0
  name: cert-exporter-x509-certificate-exporter-master
  namespace: syn-cert-exporter
---
